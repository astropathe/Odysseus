<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            
            font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
            background-color: #0d0e11;
            color: #ced4da;
            margin: 0;
            padding: 14px;
        }
        
        h3 {
            font-size: 14px;
            color: #fff;
            margin-top: 0;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px dashed #2a2d35; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            background-color: rgb(0, 255, 102, 0.1); 
            color: #00ff66; 
            border: 1px solid #00ff66;
            padding: 1px 6px;
            border-radius: 2px;
        }

        .box {
            background-color: #13151a; 
            border: 1px solid #23262d;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .label {
            font-size: 11px;
            color: #6c757d;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
        }
        .label::before {
            content: "> ";
            color: #ff3e3e;
            font-weight: bold;
            margin-right: 4px;
        }

        .value {
            font-size: 12px;
            line-height: 1.5;
            color: #e9ecef;
            word-break: break-word;
        }

        
        .score {
            color: #00ff66;
            font-weight: 700;
            background: #1a2e22;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <h3>ODYSSEUS_ <span class="status">ON</span></h3>
    
    <div class="box">
        <div class="label">Navigation réelle</div>
        <div id="real-activity" class="value">En attente de flux...</div>
    </div>

    <div class="box">
        <div class="label">Contre-poids injecté</div>
        <div id="decoy-activity" class="value">STDBY_</div>
    </div>

    <div class="box" style="margin-bottom: 0;">
        <div class="label">Brouillage publicitaire</div>
        <div id="decoy-score" class="value"><span class="score">0.00%</span></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
